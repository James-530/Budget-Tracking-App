<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracking - Transactions</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/transaction.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <header class="header">
        <div class="header-left">
            <button class="sidebar-toggle" id="sidebarToggle">☰</button>
        </div>
        <div class="header-center">
            <h1 class="page-title" id="pageTitle">Transaction</h1>
        </div>
        <div class="header-right">
            <label class="switch">
                <input type="checkbox" id="themeToggle">
                <span class="slider"></span>
            </label>
        </div>
    </header>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Menu</h2>
            <button class="sidebar-close" id="sidebarClose">✕</button>
        </div>
        <ul class="sidebar-menu">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="budget.html">Budget</a></li>
            <li><a href="transaction.html">Transaction</a></li>
        </ul>
    </nav>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content">
        <section class="transaction-section">
            <div class="card-container">
                <div class="table-container">
                    <div class="table-header">
                        <h2>Transactions</h2>
                        <button class="addBtn">Add Transaction</button>
                    </div>

                    <table class="transaction-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Item</th>
                                <th>Category</th>
                                <th>Amount</th>
                            </tr>
                        </thead>
                        <tbody id="transactionTableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <div id="transactionForm" class="form">
        <div class="form-content">
            <div class="form-header">
                <h2>Add New Transaction</h2>
                <button class="close-form" id="closeForm">✕</button>
            </div>
            <form id="innerTransactionForm">
                <div class="form-group">
                    <label for="transactionDate">Date</label>
                    <input type="date" id="transactionDate" required>
                </div>
                <div class="form-group">
                    <label for="transactionItem">Item / Description</label>
                    <input type="text" id="transactionItem" placeholder="e.g., Starbucks Coffee" required>
                </div>
                <div class="form-group">
                            <label for="transactionCategory">Category</label>
                    <select id="transactionCategory" required>
                        <option value="" disabled selected>Select a category</option>
                        <option value="Income" style="color: #22C55E; font-weight: bold;">[ + ] Money </option> 
                    </select>
                </div>
                <div class="form-group">
                    <label for="transactionAmount">Amount Spent (₱)</label>
                    <input type="number" id="transactionAmount" placeholder="0.00" min="0.01" step="0.01" required>
                </div>
                <button type="submit" class="submit-btn">Save Transaction</button>
            </form>
        </div>
    </div>

    <script src="js/global.js"></script>
    <script src="js/transaction.js"></script>
</body>

</html>
